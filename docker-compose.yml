services:
  pool:
    build: .
    command: ["com.p2pft.server.P2PServer", "--config", "/config/pool.yaml", "${P2PFT_LEASE_SECONDS:-86400}"]
    volumes:
      - ./docker/client:/config:ro
      - ./docker/pool-data:/app/pool-data
    networks: [p2pft]

  cli:
    build: .
    depends_on: [pool]
    command: ["com.p2pft.client.P2PClientCli", "upload", "/config/pool.yaml", "/config/files/sample.bin"]
    volumes:
      - ./docker/client:/config:ro
    networks: [p2pft]

  server:
    build: .
    command: ["com.p2pft.server.P2PServer", "9000", "/data/received", "${P2PFT_KEY:?set P2PFT_KEY to 64 hex characters}"]
    volumes:
      - ./docker/received:/data/received
    networks: [p2pft]

  client:
    build: .
    depends_on: [server]
    command: ["com.p2pft.client.P2PClient", "server", "9000", "/data/input/sample.bin", "${P2PFT_KEY:?set P2PFT_KEY to 64 hex characters}"]
    volumes:
      - ./docker/input:/data/input:ro
    networks: [p2pft]

networks:
  p2pft:
